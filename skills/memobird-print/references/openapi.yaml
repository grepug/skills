{
  "openapi": "3.1.0",
  "info": {
    "title": "咕咕打印服务",
    "version": "1.0.0",
    "description": "无 AppKey 的 G4HD C 蓝牙打印。页面 JavaScript 禁用。transmitted 表示蓝牙提交，不证明物理出纸完成。内容和附件 7 天，任务和日志 30 天。"
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8765"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/v1/status": {
      "get": {
        "summary": "服务、打印机、队列和渲染进程状态",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/paths": {
      "get": {
        "summary": "受管数据位置",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/printers": {
      "get": {
        "summary": "打印机状态",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PrinterStatus"
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/printers/scan": {
      "post": {
        "summary": "扫描 13 秒，需空闲且断开连接",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "type": "object"
                  }
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/printer/connect": {
      "post": {
        "summary": "连接已保存或指定打印机",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PrinterStatus"
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "id": {
                    "type": "string",
                    "format": "uuid"
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/printer/disconnect": {
      "post": {
        "summary": "断开连接；发送中断会标记不确定",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PrinterStatus"
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/jobs": {
      "post": {
        "summary": "提交实际打印",
        "responses": {
          "202": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Job"
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PrintRequest"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "schema": {
              "type": "string",
              "maxLength": 200
            }
          }
        ]
      },
      "get": {
        "summary": "按新到旧列出任务",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Job"
                  }
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "default": 200,
              "maximum": 1000
            }
          }
        ]
      }
    },
    "/v1/renders": {
      "post": {
        "summary": "提交渲染预览",
        "responses": {
          "202": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Job"
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PrintRequest"
              }
            }
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "schema": {
              "type": "string",
              "maxLength": 200
            }
          }
        ]
      }
    },
    "/v1/jobs/{id}": {
      "get": {
        "summary": "查询任务",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Job"
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/v1/jobs/{id}/cancel": {
      "post": {
        "summary": "取消任务或确认不重印不确定任务",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Job"
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/v1/jobs/{id}/artifacts/{name}": {
      "get": {
        "summary": "下载保留期内的 PDF 或打印 BMP",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "name",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "文件",
            "content": {
              "application/pdf": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              },
              "image/bmp": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "404": {
            "description": "文件不存在或已过期"
          }
        }
      }
    },
    "/v1/fonts": {
      "get": {
        "summary": "列出系统及导入字体",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        }
      },
      "post": {
        "summary": "导入 TTF/OTF/TTC 字体",
        "responses": {
          "201": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ResourceAsset"
              }
            }
          }
        }
      }
    },
    "/v1/fonts/{id}": {
      "delete": {
        "summary": "删除导入字体",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ]
      }
    },
    "/v1/logs": {
      "get": {
        "summary": "查询结构化日志",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "type": "object"
                  }
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "job",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "level",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "since",
            "in": "query",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "maximum": 10000
            }
          }
        ]
      }
    },
    "/v1/maintenance/prune": {
      "post": {
        "summary": "清理过期内容、任务和日志；保留活动任务及未确认的不确定状态",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object"
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/jobs/{id}/purge": {
      "post": {
        "summary": "清理终态任务的文件，保留历史和幂等记录",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "清理后的任务",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Job"
                }
              }
            }
          },
          "409": {
            "description": "活动任务不能清理"
          }
        }
      }
    },
    "/v1/printer/power": {
      "get": {
        "summary": "查询打印机自动关机时间（实际设备回读，不出纸）",
        "responses": {
          "200": {
            "description": "设备回读成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PrinterStatus"
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        }
      }
    },
    "/v1/printer/auto-off": {
      "post": {
        "summary": "设置自动关机并回读验证，保存重连偏好",
        "description": "0 关闭定时关机，1–255 为分钟数。设置与打印互斥，忙时 409；超时或回读不一致返回错误。不能防止电池耗尽、断电或手动关机。",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "minutes": {
                    "type": "integer",
                    "minimum": 0,
                    "maximum": 255
                  }
                },
                "required": [
                  "minutes"
                ]
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "设备回读成功",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PrinterStatus"
                }
              }
            }
          },
          "default": {
            "description": "结构化错误",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "error": {
                      "$ref": "#/components/schemas/Error"
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "ResourceAsset": {
        "type": "object",
        "required": [
          "path",
          "data"
        ],
        "properties": {
          "path": {
            "type": "string"
          },
          "data": {
            "type": "string",
            "contentEncoding": "base64"
          },
          "mimeType": {
            "type": "string"
          }
        }
      },
      "Document": {
        "type": "object",
        "required": [
          "kind"
        ],
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "markdown",
              "html",
              "image"
            ]
          },
          "content": {
            "type": "string"
          },
          "css": {
            "type": "string"
          },
          "font": {
            "type": "string",
            "default": "PingFang SC"
          },
          "fontSize": {
            "type": "number",
            "default": 26,
            "minimum": 6,
            "maximum": 120
          },
          "assets": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ResourceAsset"
            }
          },
          "printerBitmap": {
            "type": "boolean",
            "default": false,
            "description": "按任务保留打印机原始BMP：仅image且恰好一个资源；576点宽、1位未压缩、顶行优先、白0黑1、62字节头、1–4000行。4000行为软件保护上限，可靠硬件高度待验证；普通请求默认仍按原方式渲染。"
          }
        }
      },
      "PrintRequest": {
        "type": "object",
        "oneOf": [
          {
            "required": [
              "document"
            ]
          },
          {
            "required": [
              "renderId"
            ]
          }
        ],
        "properties": {
          "document": {
            "$ref": "#/components/schemas/Document"
          },
          "renderId": {
            "type": "string",
            "format": "uuid"
          }
        }
      },
      "Error": {
        "type": "object",
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "retryable": {
            "type": "boolean"
          },
          "status": {
            "type": "integer"
          }
        }
      },
      "Job": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "mode": {
            "type": "string",
            "enum": [
              "print",
              "render"
            ]
          },
          "state": {
            "type": "string",
            "enum": [
              "queued",
              "rendering",
              "rendered",
              "waiting_for_printer",
              "sending",
              "transmitted",
              "failed",
              "cancelled",
              "uncertain"
            ]
          },
          "createdAt": {
            "type": "string",
            "format": "date-time"
          },
          "updatedAt": {
            "type": "string",
            "format": "date-time"
          },
          "artifactsExpired": {
            "type": "boolean"
          },
          "artifacts": {
            "type": "object",
            "properties": {
              "pdf": {
                "type": "string"
              },
              "bitmaps": {
                "type": "array",
                "items": {
                  "type": "string"
                }
              },
              "height": {
                "type": "integer"
              }
            }
          },
          "error": {
            "$ref": "#/components/schemas/Error"
          },
          "deviceAcknowledgement": {
            "type": "string"
          }
        }
      },
      "PrinterStatus": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "ready": {
            "type": "boolean"
          },
          "sending": {
            "type": "boolean"
          },
          "scanning": {
            "type": "boolean"
          },
          "message": {
            "type": "string"
          },
          "autoOffMinutes": {
            "type": "integer",
            "minimum": 0,
            "maximum": 255,
            "description": "本次连接内设备回读值，断连后省略；0 为关闭定时关机"
          },
          "desiredAutoOffMinutes": {
            "type": "integer",
            "minimum": 0,
            "maximum": 255,
            "description": "持久化重连偏好，不等于已完成设备回读"
          }
        },
        "required": [
          "ready",
          "sending",
          "scanning",
          "message"
        ]
      }
    }
  }
}
