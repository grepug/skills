<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>清单模板</title></head>
<body>
<main class="receipt">
  <p class="eyebrow">今日清单</p>
  <h1>先完成最重要的一件事</h1>
  <p class="intro">以下是通用示例，请替换为当前已确认的内容。</p>
  <section class="tasks">
    <article class="task"><span class="box" aria-hidden="true"></span><div>
      <p class="priority">重点一</p><h2>整理材料</h2>
      <p>检查资料是否齐全，并记录仍需确认的事项。</p>
    </div></article>
    <article class="task"><span class="box" aria-hidden="true"></span><div>
      <p class="ordinal">接下来</p><h2>完成检查</h2>
      <p>核对结果和下一步安排。保留判断语气，不将待确认事项写成结论。</p>
    </div></article>
  </section>
  <footer>完成后勾选。这里只演示排版，不会提交打印任务。</footer>
</main>
</body>
</html>
